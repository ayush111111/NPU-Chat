# Docker Compose for Open WebUI + Langflow + FastFlowLM
# This connects Open WebUI and Langflow to your local FastFlowLM NPU server

version: '3.8'

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3000:8080"  # Access at http://localhost:3000
    volumes:
      - open-webui-data:/app/backend/data
    environment:
      # Point to FastFlowLM's OpenAI-compatible API
      - OPENAI_API_BASE_URL=http://host.docker.internal:52625/v1
      - OPENAI_API_KEY=dummy-key

      # Disable Ollama (we're using FastFlowLM instead)
      - OLLAMA_BASE_URL=

      # Embeddings - use FastFlowLM NPU instead of CPU model in Docker
      - RAG_EMBEDDING_ENGINE=openai
      - RAG_EMBEDDING_MODEL=embed-gemma:300m
      - RAG_OPENAI_API_BASE_URL=http://host.docker.internal:52625/v1
      - RAG_OPENAI_API_KEY=dummy-key
      # Chunk size matched to embed-gemma:300m max context (2048 tokens ~ 8000 chars)
      - CHUNK_SIZE=8000
      - CHUNK_OVERLAP=200

      # Performance optimizations
      - WEBUI_AUTH=false  # Set to true if you want login
      - WEBUI_SECRET_KEY=change-this-secret-key
      - ENABLE_TITLE_GENERATION=false
      - ENABLE_FOLLOW_UP_GENERATION=false
      - ENABLE_TAGS_GENERATION=false
      - ENABLE_RETRIEVAL_QUERY_GENERATION=false
      - ENABLE_IMAGE_PROMPT_GENERATION=false
      - ENABLE_WEB_SEARCH=false
      - ENABLE_SEARCH_QUERY_GENERATION=false

    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  langflow:
    image: langflowai/langflow:latest
    container_name: langflow
    ports:
      - "7860:7860"  # Access at http://localhost:7860
    volumes:
      - langflow-data:/app/langflow
    environment:
      # Pre-configure FastFlowLM as the OpenAI-compatible endpoint
      - OPENAI_API_KEY=dummy-key
      - OPENAI_API_BASE=http://host.docker.internal:52625/v1
      # Expose these to Langflow's global variables (usable in all flows)
      - LANGFLOW_VARIABLES_TO_GET_FROM_ENVIRONMENT=OPENAI_API_KEY,OPENAI_API_BASE
      # Database & storage
      - LANGFLOW_CONFIG_DIR=/app/langflow
      # Auto-login (no auth for local use)
      - LANGFLOW_AUTO_LOGIN=true

    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  open-webui-data:
  langflow-data:

# INSTRUCTIONS:
#
# 1. Make sure FastFlowLM is running:
#    flm serve qwen3.5:2b --asr 1 --port 52625
#    (or double-click start-flm.bat)
#
# 2. Start all services:
#    docker compose up -d
#
# 3. Open WebUI  → http://localhost:3000  (chat UI)
#    Langflow     → http://localhost:7860  (agent/flow builder)
#
# 4. In Langflow, use the OpenAI component and set:
#    - Base URL: http://host.docker.internal:52625/v1
#    - API Key:  dummy-key
#    - Model:    qwen3.5:2b
#
# 5. Check logs:
#    docker compose logs -f
#
# 6. Stop:
#    docker compose down
